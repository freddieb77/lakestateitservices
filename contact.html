<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | LakeState IT Services</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="navbar container">

    <a href="index.html">
      <img src="images/logo.svg" alt="LakeState IT Services Logo" height="40">
    </a>

    <!-- Hamburger Button -->
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Navigation -->
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="btn">Schedule Consultation</a>
    </nav>

  </div>
</header>

<section>
  <div class="container">
    <h1>Schedule a Free Consultation</h1>
    <p style="margin-bottom:30px;">
      Submit the form below and receive a response within one business day.
    </p>

    <form name="contact" method="POST" action="/thank-you.html"
          data-netlify="true"
          data-netlify-recaptcha="true"
          netlify-honeypot="bot-field">

      <input type="hidden" name="form-name" value="contact">

      <p style="display:none;">
        <label>Don’t fill this out: <input name="bot-field"></label>
      </p>

      <input type="text" name="name" placeholder="Full Name" required style="width:100%; padding:12px; margin-bottom:15px;">
      <input type="email" name="email" placeholder="Email Address" required style="width:100%; padding:12px; margin-bottom:15px;">
      <textarea name="message" placeholder="Tell us about your current IT environment..." required style="width:100%; padding:12px; margin-bottom:15px;"></textarea>

      <div data-netlify-recaptcha="true" style="margin-bottom:20px;"></div>

      <button type="submit" class="btn">Submit Request</button>
    </form>
  </div>
</section>

<footer>
  <div class="container">
    <p>Minneapolis, MN</p>
    <p>(XXX) XXX-XXXX</p>
    <p>info@lakestatit.com</p>
    <p>M–F 8:00am–4:00pm</p>

    <div class="footer-links">
      <a href="index.html">Facebook</a>
      <a href="index.html">Instagram</a>
      <a href="index.html">Twitter</a>
    </div>

    <p style="margin-top:20px;">
      © 2026 LakeState IT Services LLC. All Rights Reserved.
    </p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
